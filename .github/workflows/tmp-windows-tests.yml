name: tmp-windows-tests
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        emacs: ['29.4', '30.1']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: jcs090218/setup-emacs@master
      with:
        version: ${{ matrix.emacs }}
    - name: Show tree/find on PATH
      shell: bash
      run: |
        emacs -Q --batch --eval '(message "tree=%S find=%S system-type=%S" (executable-find "tree") (executable-find "find") system-type)'
    - name: Install dependencies
      shell: bash
      run: |
        cat > deps.el <<'ELISP'
        (require 'package)
        (setq package-user-dir (expand-file-name "ci-elpa"))
        (add-to-list 'package-archives '("melpa" . "https://melpa.org/packages/") t)
        (package-initialize)
        (unless (and (package-installed-p 'gptel) (package-installed-p 'yaml)
                     (package-installed-p 'orderless))
          (package-refresh-contents)
          (dolist (p '(compat gptel yaml orderless))
            (unless (package-installed-p p) (package-install p))))
        ELISP
        emacs -Q --batch -l deps.el
    - name: Run tool tests
      shell: bash
      run: emacs -Q --batch -l deps.el -L . -L test -l test/gptel-agent-test-tools.el -f ert-run-tests-batch-and-exit
